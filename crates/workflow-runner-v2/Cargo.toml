[package]
name = "workflow-runner-v2"
version = "0.1.1"
edition = "2021"

# The binary entrypoint moved out-of-tree to
# `launchapp-dev/animus-workflow-runner-default` v0.3.0. This crate is now
# library-only; the 3 ao-cli daemon crates (orchestrator-daemon-runtime,
# orchestrator-cli, orchestrator-git-ops) still import its IPC contract
# types, phase_session, runtime_support, reattach back-channel constants,
# and agent-memory helpers from here. The lib code is duplicated with the
# plugin repo and will be deduplicated by extracting a shared
# `animus-runtime-shared` crate as a v0.6 follow-up.

[lib]
name = "workflow_runner_v2"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
jsonschema = "0.45"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

agent-runner = { path = "../agent-runner" }
protocol = { path = "../protocol" }
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-logging = { path = "../orchestrator-logging" }
orchestrator-config = { workspace = true }
orchestrator-store = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.10"

[lints]
workspace = true
