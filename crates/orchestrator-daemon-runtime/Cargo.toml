[package]
name = "orchestrator-daemon-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "orchestrator_daemon_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
croner = { workspace = true }
fs2 = "0.4"
futures-core = "0.3"
futures-util = "0.3"
glob = "0.3"
libc = "0.2"
orchestrator-core = { workspace = true }
orchestrator-logging = { workspace = true }
orchestrator-plugin-host = { workspace = true }
animus-plugin-protocol = { workspace = true }
animus-control-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.13" }
animus-log-storage-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.13" }
# We use Subject / SubjectChangedEvent from the same v0.1.13 surface the
# control-protocol references. Pulled from the same git tag so the
# protocol versions stay in lockstep; subject backends / inproc adapters
# pin the matching upstream version, and the daemon translates at the
# boundary.
animus-subject-protocol-wire = { package = "animus-subject-protocol", git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.13" }
# v0.5 plugin protocol crates used by `plugin_clients` for routing
# `queue/*` and `workflow/*` RPCs through installed plugins.
# `protocol::SubjectDispatch` (re-exported from `animus-subject-protocol`)
# remains the canonical type; `services::plugin_clients` serializes via
# the v0.5 types over the wire.
animus-queue-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.5.3" }
animus-workflow-runner-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.5.3" }
animus-subject-protocol-v05 = { package = "animus-subject-protocol", git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.5.3" }
protocol = { workspace = true }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
animus-runtime-shared = { workspace = true }
agent-runner = { path = "../agent-runner" }
# v0.5.1 fold-in (item 7): unified Unix-socket + Windows-named-pipe client
# for the reattach back-channel. Replaces the previous `cfg(unix)`-only
# `tokio::net::UnixStream` path with a single cross-platform implementation.
interprocess = "2.4"

[dev-dependencies]
protocol = { workspace = true, features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "test-util", "time"] }
animus-control-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.13", features = ["client"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
animus-subject-protocol-wire = { package = "animus-subject-protocol", git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.13" }
animus-runtime-shared = { workspace = true }

[lints]
workspace = true
