[package]
name = "orchestrator-daemon-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "orchestrator_daemon_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
croner = { workspace = true }
fs2 = "0.4"
notify = "6"
futures-core = "0.3"
futures-util = "0.3"
glob = "0.3"
libc = "0.2"
orchestrator-config = { workspace = true }
orchestrator-core = { workspace = true }
orchestrator-logging = { workspace = true }
orchestrator-plugin-host = { workspace = true }
animus-plugin-protocol = { workspace = true }
animus-config-protocol = { workspace = true }
animus-control-protocol = { workspace = true }
animus-execution-protocol = { workspace = true }
animus-log-storage-protocol = { workspace = true }
animus-actor = { workspace = true }
# Subject / SubjectChangedEvent share the control protocol's source revision so
# their embedded types stay in lockstep.
animus-subject-protocol-wire = { workspace = true }
protocol = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
animus-runtime-shared = { workspace = true }
# v0.5.1 fold-in (item 7): unified Unix-socket + Windows-named-pipe client
# for the reattach back-channel. Replaces the previous `cfg(unix)`-only
# `tokio::net::UnixStream` path with a single cross-platform implementation.
interprocess = { version = "2.4", features = ["tokio"] }

[dev-dependencies]
orchestrator-config = { workspace = true, features = ["test-utils"] }
protocol = { workspace = true, features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "test-util", "time"] }
animus-control-protocol = { workspace = true, features = ["client"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
animus-subject-protocol-wire = { workspace = true }
animus-runtime-shared = { workspace = true }

[lints]
workspace = true
