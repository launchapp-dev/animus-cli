[package]
name = "orchestrator-cli"
version = "0.7.0-rc.3"
edition = "2021"
license = "Elastic-2.0"
default-run = "animus"

[[bin]]
name = "animus"
path = "src/main.rs"

[[bin]]
name = "animus-mcp-proxy"
path = "src/bin/animus_mcp_proxy.rs"

[[bin]]
name = "animus-hook"
path = "src/bin/animus_hook.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "time", "net", "signal"] }
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-logging = { path = "../orchestrator-logging" }
orchestrator-plugin-host = { workspace = true }
animus-plugin-protocol = { workspace = true }
# v0.7 TASK-166 Phase 2: environment wire types (EnvironmentSpec /
# HarnessCommand / ExecStream) for the agent-run env-exec seam in
# `services::runtime::runtime_agent::environment_exec`.
animus-environment-protocol = { workspace = true }
# v0.1.x-lineage protocol crates. Pinned to v0.1.26 so they share ONE
# `animus-subject-protocol` rev (0.1.16) with the workspace `protocol` dep and
# the control surface — control-protocol's `WorkflowRunSummary.subject_id` etc.
# embed subject-protocol types, so `animus-subject-protocol-wire` MUST match
# control's rev. v0.1.26 additively adds `actor: Option<Actor>` to the control +
# workflow-runner request types relayed by the control surface / plugin_clients.
animus-control-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.7.0-rc.5" }
animus-log-storage-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.7.0-rc.5" }
animus-subject-protocol-wire = { package = "animus-subject-protocol", git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.7.0-rc.5" }
animus-actor = { workspace = true }
# Plugin protocol crates used by the plugin-host wrappers in
# `services::plugin_clients` to dispatch `workflow/*` and `queue/*` RPCs through
# installed `workflow_runner` / `queue` plugins. The runner gains `actor` at
# v0.1.26. `animus-queue-protocol` + `animus-subject-protocol-v05` stay on the
# matched v0.5.10 pair so `SubjectId` unifies in `QueueLeaseRequest`; they must
# NOT share `animus-subject-protocol-wire`'s rev (cargo forbids two names for one
# package instance), so they stay a distinct rev.
animus-queue-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.5.10" }
animus-workflow-runner-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.7.0-rc.5" }
animus-subject-protocol-v05 = { package = "animus-subject-protocol", git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.5.10" }
protocol = { workspace = true }
animus-session-backend = { workspace = true }
which = "8"
orchestrator-daemon-runtime = { workspace = true }
animus-runtime-shared = { workspace = true }
animus-mcp-oauth = { workspace = true }
orchestrator-config = { workspace = true }
dirs = "6.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "1.2", features = ["transport-io"] }
schemars = "1.0"
sha2 = "0.10"
semver = "1"
webbrowser = "1"
termimad = "0.34"
libc = "0.2"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
colored = "3.0"
tracing = "0.1"
tempfile = "3"
tar = "0.4"
zstd = "0.13"
flate2 = "1.0"
toml = "1.0"

[dev-dependencies]
assert_cmd = "2"
fs2 = "0.4"
protocol = { workspace = true, features = ["test-utils"] }
# v0.6: enable the config_source test seam so unit tests can inject a base
# WorkflowConfig in place of an installed config_source plugin.
orchestrator-config = { workspace = true, features = ["test-utils"] }
tempfile = "3"
toml = "1.0"

[lints]
workspace = true
