[package]
name = "orchestrator-cli"
version = "0.5.15"
edition = "2021"
license = "Elastic-2.0"
default-run = "animus"

[[bin]]
name = "animus"
path = "src/main.rs"

[[bin]]
name = "animus-mcp-proxy"
path = "src/bin/animus_mcp_proxy.rs"

[[bin]]
name = "animus-hook"
path = "src/bin/animus_hook.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "time", "net", "signal"] }
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-logging = { path = "../orchestrator-logging" }
orchestrator-plugin-host = { workspace = true }
animus-plugin-protocol = { workspace = true }
animus-control-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.13" }
animus-log-storage-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.13" }
animus-subject-protocol-wire = { package = "animus-subject-protocol", git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.1.13" }
# v0.5 plugin protocol crates — used by the plugin-host wrappers in
# `services::plugin_clients` to dispatch `workflow/*` and `queue/*` RPCs
# through installed `workflow_runner` / `queue` plugins. The transitively
# pulled `animus-subject-protocol` (v0.5.0 git source) is the canonical
# `SubjectDispatch` identity; `protocol::SubjectDispatch` re-exports it.
# Wire formats remain byte-for-byte compatible with the v0.1.13 surface
# per the Wave 1 handoff state.
# TEMP (queue-only/precise-wake verification): local path for queue/next_deadline + dedup.
# Flip to { git = "...", tag = "v0.5.10" } before release.
animus-queue-protocol = { path = "../../../animus-staging/animus-protocol/animus-queue-protocol" }
animus-workflow-runner-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.5.3" }
# Must share the same subject-protocol revision as animus-queue-protocol so SubjectId
# unifies in QueueLeaseRequest.exclude_subjects. TEMP local path; flip to tag v0.5.10.
animus-subject-protocol-v05 = { package = "animus-subject-protocol", path = "../../../animus-staging/animus-protocol/animus-subject-protocol" }
protocol = { path = "../protocol" }
animus-session-backend = { workspace = true }
which = "8"
orchestrator-daemon-runtime = { workspace = true }
animus-runtime-shared = { workspace = true }
animus-mcp-oauth = { workspace = true }
orchestrator-config = { workspace = true }
dirs = "6.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "1.2", features = ["transport-io"] }
schemars = "1.0"
sha2 = "0.10"
semver = "1"
webbrowser = "1"
termimad = "0.34"
libc = "0.2"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["json"] }
colored = "3.0"
tracing = "0.1"
tempfile = "3"
tar = "0.4"
zstd = "0.13"
flate2 = "1.0"
toml = "1.0"

[dev-dependencies]
assert_cmd = "2"
fs2 = "0.4"
protocol = { path = "../protocol", features = ["test-utils"] }
tempfile = "3"
toml = "1.0"

[lints]
workspace = true
