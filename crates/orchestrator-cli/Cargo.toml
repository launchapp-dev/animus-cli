[package]
name = "orchestrator-cli"
version = "0.7.0-rc.41"
edition = "2021"
license = "Elastic-2.0"
default-run = "animus"

[[bin]]
name = "animus"
path = "src/main.rs"

[[bin]]
name = "animus-mcp-proxy"
path = "src/bin/animus_mcp_proxy.rs"

[[bin]]
name = "animus-hook"
path = "src/bin/animus_hook.rs"

# Hermetic binaries used only by the plugin E2E integration tests. Keeping the
# fixtures in this package lets Cargo provide CARGO_BIN_EXE_* paths from a fresh
# checkout instead of relying on separately cloned or pre-built repositories.
[[bin]]
name = "animus-plugin-smoke"
path = "tests/fixtures/animus_plugin_smoke.rs"
test = false
bench = false
doc = false

[[bin]]
name = "animus-provider-mock"
path = "tests/fixtures/animus_provider_mock.rs"
test = false
bench = false
doc = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "time", "net", "signal"] }
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-logging = { path = "../orchestrator-logging" }
orchestrator-plugin-host = { workspace = true }
animus-plugin-runtime = { path = "../animus-plugin-runtime" }
animus-plugin-protocol = { workspace = true }
animus-application-protocol = { workspace = true }
# v0.7 TASK-166 Phase 2: environment wire types (EnvironmentSpec /
# HarnessCommand / ExecStream) for the agent-run env-exec seam in
# `services::runtime::runtime_agent::environment_exec`.
animus-environment-protocol = { workspace = true }
animus-execution-protocol = { workspace = true }
animus-control-protocol = { workspace = true }
animus-log-storage-protocol = { workspace = true }
animus-subject-protocol-wire = { workspace = true }
animus-actor = { workspace = true }
# Plugin protocol crates used by the plugin-host wrappers in
# `services::plugin_clients` to dispatch `workflow/*` and `queue/*` RPCs through
# installed `workflow_runner` / `queue` plugins. Keep both on the same release
# as the control and subject wire crates so QueueLeaseRequest uses the canonical
# SubjectId instead of retaining a second legacy protocol source.
animus-queue-protocol = { workspace = true }
animus-workflow-runner-protocol = { workspace = true }
protocol = { workspace = true }
animus-session-backend = { workspace = true }
which = "8"
orchestrator-daemon-runtime = { workspace = true }
animus-runtime-shared = { workspace = true }
animus-mcp-oauth = { workspace = true }
orchestrator-config = { workspace = true }
dirs = "6.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "1.2", features = ["transport-io"] }
schemars = "1.0"
sha2 = "0.10"
semver = "1"
webbrowser = "1"
termimad = "0.34"
libc = "0.2"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
colored = "3.0"
tracing = "0.1"
tempfile = "3"
tar = "0.4"
zstd = "0.13"
flate2 = "1.0"
toml = "1.0"

[dev-dependencies]
assert_cmd = "2"
fs2 = "0.4"
postgres = "=0.19.10"
protocol = { workspace = true, features = ["test-utils"] }
# v0.6: enable the config_source test seam so unit tests can inject a base
# WorkflowConfig in place of an installed config_source plugin.
orchestrator-config = { workspace = true, features = ["test-utils"] }
tempfile = "3"
toml = "1.0"

[lints]
workspace = true
