[package]
name = "orchestrator-config"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
croner = { workspace = true }
dirs = "6.0"
protocol = { workspace = true }
# v0.6: resolve an installed `config_source` plugin (else fall back to in-tree YAML).
orchestrator-plugin-host = { workspace = true }
animus-config-protocol = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
sha2 = "0.10"
toml = "1.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[features]
# Exposes the v0.6 config_source test seam (`install_yaml_config_source_base`)
# to OTHER crates' test builds. The kernel sources its base WorkflowConfig from
# an installed config_source plugin; unit tests in dependent crates can't spawn
# one, so this feature lets them inject a synthetic base. Never enable in
# production builds.
test-utils = []

[lints]
workspace = true
