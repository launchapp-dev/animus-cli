[package]
name = "animus-runtime-shared"
version = "0.1.0"
edition = "2021"
description = "Shared runtime modules used by Animus's workflow_runner plugins and the kernel daemon — phase session/output state, agent memory, runtime contract construction, the runner Unix-socket IPC bridge, workflow event emitters, and the reattach back-channel."
license = "Elastic-2.0"
repository = "https://github.com/launchapp-dev/animus-runtime-shared"

[lib]
name = "animus_runtime_shared"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
fs2 = "0.4"
jsonschema = "0.45"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "net", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
# v0.5.1 fold-in (item 7): cross-platform local IPC abstraction so the
# reattach back-channel uses ONE wire-protocol path on both Unix (domain
# sockets) and Windows (named pipes). Surface-shrink: deletes the
# previous `cfg(unix)`-only reattach module in favor of a shared
# `interprocess::local_socket` server.
interprocess = "2.4"

# Recording layer (v0.5.x Task E1 fold-in): the decision-log recorder
# was moved here from `agent-runner` so both the daemon and the future
# agent-runner plugin can depend on a single canonical implementation.
thiserror = "2"
zstd = "0.13"
animus-plugin-protocol   = { workspace = true }
orchestrator-plugin-host = { workspace = true }

# When vendored inside the ao-cli workspace this crate uses the in-tree
# `protocol` / `orchestrator-core` / `orchestrator-config` workspace
# members. The out-of-tree `launchapp-dev/animus-runtime-shared` repo
# replaces these with `git` deps pinned to a `launchapp-dev/animus-cli`
# rev — keep both in sync when pushing a new shared-crate version.
# (v0.5.3 surface-shrink: `orchestrator-store` was folded into
# `orchestrator-core::store`; `fsync_rename` is re-exported from there.)
protocol            = { workspace = true }
orchestrator-core   = { workspace = true }
orchestrator-config = { workspace = true }

# v0.5.5: kernel-level OAuth broker for HTTP-transport MCP servers.
# `reqwest::blocking` is used because the runtime_contract assembly path
# is synchronous (called from the workflow_runner plugin without a tokio
# context guarantee). Token resolution happens once per phase, on the
# caller thread, with on-disk caching keyed by `<server>.json`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[features]
# Exposes the `phase_session::test_fault` and `phase_output::test_fault`
# helpers to downstream test crates (e.g. the plugin's integration tests)
# without making them visible in production builds.
test-fault = []

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[lints.clippy]
too_many_arguments = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
similar_names = "allow"
wildcard_imports = "allow"
