[package]
name = "animus-runtime-shared"
version = "0.1.0"
edition = "2021"
description = "Shared runtime modules used by Animus's workflow_runner plugins and the kernel daemon — phase session/output state, agent memory, runtime contract construction, the runner Unix-socket IPC bridge, workflow event emitters, and the reattach back-channel."
license = "Elastic-2.0"
repository = "https://github.com/launchapp-dev/animus-runtime-shared"

[lib]
name = "animus_runtime_shared"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
jsonschema = "0.45"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "net", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# When vendored inside the ao-cli workspace this crate uses the in-tree
# `protocol` / `orchestrator-core` / `orchestrator-config` /
# `orchestrator-store` workspace members. The out-of-tree
# `launchapp-dev/animus-runtime-shared` repo replaces these with `git` deps
# pinned to a `launchapp-dev/animus-cli` rev — keep both in sync when
# pushing a new shared-crate version.
protocol            = { workspace = true }
orchestrator-core   = { workspace = true }
orchestrator-config = { workspace = true }
orchestrator-store  = { workspace = true }

[features]
# Exposes the `phase_session::test_fault` and `phase_output::test_fault`
# helpers to downstream test crates (e.g. the plugin's integration tests)
# without making them visible in production builds.
test-fault = []

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[lints.clippy]
too_many_arguments = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
similar_names = "allow"
wildcard_imports = "allow"
