[package]
name = "orchestrator-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "signal", "time", "net", "io-util", "process"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
zstd = "0.13"
tempfile = "3"
protocol = { workspace = true }
animus-actor = { workspace = true }
animus-journal-protocol = { workspace = true }
animus-plugin-protocol = { workspace = true }
orchestrator-plugin-host = { workspace = true }
orchestrator-config = { workspace = true }
orchestrator-logging = { workspace = true }
toml = "1.0"
serde_yaml = "0.9"
thiserror = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native-sync-persistent", "windows-native", "crypto-rust"] }
# Device-encrypted secret store (pure-Rust RustCrypto; satisfies rust-only dep policy).
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
# v0.6: enable the config_source test seam so unit tests can inject a base
# WorkflowConfig in place of an installed config_source plugin.
orchestrator-config = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
