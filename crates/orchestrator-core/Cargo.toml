[package]
name = "orchestrator-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "signal", "time", "net", "io-util", "process"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6.0"
libc = "0.2"
fs2 = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
zstd = "0.13"
tempfile = "3"
protocol = { path = "../protocol" }
animus-plugin-protocol = { workspace = true }
orchestrator-plugin-host = { workspace = true }
orchestrator-config = { workspace = true }
orchestrator-logging = { workspace = true }
which = "8"
toml = "1.0"
serde_yaml = "0.9"
thiserror = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native-sync-persistent", "windows-native", "crypto-rust"] }

[lints]
workspace = true
