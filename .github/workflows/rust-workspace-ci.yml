name: Rust Workspace CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: rust-workspace-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub Actions runner Node 20 -> Node 24 deprecation (effective 2026-06-02).
  # Forces JS-based actions onto Node 24 ahead of the cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs-sync:
    name: docs-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check docs/code sync
        run: bash scripts/check-doc-sync.sh

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux build deps (libdbus for keyring crate)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  cargo-check:
    name: cargo-check (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps (libdbus for keyring crate)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        # Workspace-wide check keeps every runtime-critical crate covered
        # (see docs/guides/ci-cd.md) without a manual matrix that drifts
        # from the doc list. Single job + shared cache is also cheaper
        # than the prior fan-out.
        run: cargo check --locked --all-targets --workspace

  android-check:
    name: android-check (aarch64-linux-android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Add aarch64-linux-android target to the pinned toolchain
        # The repo's rust-toolchain.toml pins a specific channel (1.96.0 as of
        # this writing), which silently overrides whichever toolchain the
        # action above resolved "stable" to and installed the target on —
        # confirmed in CI: the action's `targets:` input installed the target
        # for "stable", but the pinned 1.96.0 toolchain (the one actually
        # active once rustup reads rust-toolchain.toml) never got it,
        # producing "error[E0463]: can't find crate for core". `rustup target
        # add` with no explicit toolchain always operates on whichever one is
        # actually active, so it's immune to this stable-vs-pinned mismatch.
        run: rustup target add aarch64-linux-android

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check orchestrator-cli for aarch64-linux-android
        # A transitive native dependency's build.rs still invokes a real C
        # compiler under `cargo check` (only the final link of the top-level
        # binary is skipped), so this needs the NDK toolchain, not just the
        # Rust target — confirmed locally, cargo check without CC_/AR_/linker
        # env vars fails with "failed to find tool aarch64-linux-android-clang".
        # This job exists to catch Android-target regressions from TASK-1613:
        # reqwest must stay on rustls-tls (not the native-tls default, which
        # needs openssl-sys — unavailable on bionic), and any new
        # File::unlock() call site needs the explicit
        # fs2::FileExt::unlock(&f) form, since Rust's own File::unlock has no
        # Android implementation.
        env:
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
        run: cargo check --locked -p orchestrator-cli --target aarch64-linux-android

  smoke-help:
    name: smoke-help
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: cargo-check
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps (libdbus for keyring crate)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Smoke test animus help
        run: cargo run --locked -p orchestrator-cli --bin animus -- --help
